<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - VidyaAI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site">
    <div class="container nav">
      <a class="brand" href="/">VidyaAI</a>
    </div>
  </header>

  <main class="container">
    <div class="card auth-card">
      <h2>Login</h2>
      <div id="form-error" class="alert alert-error hidden" role="alert"></div>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-block">Login</button>
      </form>
      <p>New here? <a href="/register.html">Register</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
