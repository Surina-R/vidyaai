<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - VidyaAI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site">
    <div class="container nav">
      <a class="brand" href="/">VidyaAI</a>
    </div>
  </header>

  <main class="container">
    <div class="card auth-card">
      <h2>Create your student account</h2>
      <div id="form-error" class="alert alert-error hidden" role="alert"></div>
      <form id="register-form">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" maxlength="60" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" maxlength="120" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="8" required autocomplete="new-password">
          <div class="hint">At least 8 characters, with a letter and a number.</div>
        </div>
        <div class="field">
          <label for="grade">Class</label>
          <select id="grade" required></select>
        </div>
        <div class="field">
          <label for="school">School (optional)</label>
          <input type="text" id="school" maxlength="100">
        </div>
        <div class="field">
          <label>Subjects</label>
          <div id="subjects" class="checks"></div>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-block">Create account</button>
      </form>
      <p>Already registered? <a href="/login.html">Login</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
